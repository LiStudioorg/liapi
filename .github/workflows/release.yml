name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  # ── 0. 构建管理台 SPA（go:embed 依赖它）────────────────
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: adminui
          path: server/adminui
          if-no-files-found: error

  # ── 1. 枚举平台，分流到 Linux / macOS runner ─────────
  list-targets:
    runs-on: ubuntu-latest
    outputs:
      linux_targets: ${{ steps.set.outputs.linux }}
      mac_targets:   ${{ steps.set.outputs.mac }}
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - id: set
        run: |
          ALL=$(go tool dist list)

          LINUX=$(echo "$ALL" | grep -vE '^ios/' \
            | awk -F/ '{printf "{\"goos\":\"%s\",\"goarch\":\"%s\"},", $1, $2}')
          echo "linux=[${LINUX%,}]" >> "$GITHUB_OUTPUT"

          MAC=$(echo "$ALL" | grep -E '^ios/' \
            | awk -F/ '{printf "{\"goos\":\"%s\",\"goarch\":\"%s\"},", $1, $2}')
          echo "mac=[${MAC%,}]" >> "$GITHUB_OUTPUT"

  # ── 2a. Linux runner ─────────────────────────────────
  build-linux:
    needs: [list-targets, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list-targets.outputs.linux_targets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Use freshly built admin UI
        uses: actions/download-artifact@v4
        with:
          name: adminui
          path: server/adminui

      # ★ 只在 Android 平台启用 NDK 缓存
      - name: Cache Android NDK
        if: startsWith(matrix.target.goos, 'android')
        uses: actions/cache@v4
        with:
          path: android-ndk-r26b
          key: ndk-r26b-${{ runner.os }}
          restore-keys: |
            ndk-r26b-

      - name: Build
        continue-on-error: true
        env:
          ENABLE_VERSION_INJECT: '1'
        run: |
          chmod +x buildrelease.sh
          ./buildrelease.sh "${{ matrix.target.goos }}/${{ matrix.target.goarch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/
          if-no-files-found: ignore

  # ── 2b. macOS runner（仅 iOS）─────────────────────────
  build-macos:
    needs: [list-targets, build-frontend]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list-targets.outputs.mac_targets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Use freshly built admin UI
        uses: actions/download-artifact@v4
        with:
          name: adminui
          path: server/adminui

      - name: Build
        continue-on-error: true
        env:
          ENABLE_VERSION_INJECT: '1'
        run: |
          chmod +x buildrelease.sh
          ./buildrelease.sh "${{ matrix.target.goos }}/${{ matrix.target.goarch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/
          if-no-files-found: ignore

  # ── 3. 汇总发布（终极安全版）─────────────────────────
  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Package and Generate checksums
        run: |
          # 如果 artifacts 目录不存在（全构建失败），创建一个空目录防止后续命令报错
          mkdir -p artifacts
          
          # 打包所有产物（无论里面包含文件还是文件夹）
          tar -czf release.tar.gz -C artifacts .
          
          # 对压缩包生成校验和
          sha256sum release.tar.gz > release.tar.gz.sha256
          
          # 打印日志，方便排查
          echo "✅ 成功生成校验和："
          cat release.tar.gz.sha256

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release.tar.gz
            release.tar.gz.sha256
          generate_release_notes: true
          draft: false
